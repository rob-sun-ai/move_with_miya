name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-deps
        with:
          install: 'true'

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-deps
      - run: npm run lint
      # The service lint scripts run `eslint --fix`; fail if that changed code.
      - run: git diff --exit-code
      - run: npx prettier --check .

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-deps
      - run: npm run typecheck

  build:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-deps
      - run: npm run build --prefix backend
      - run: npm run build --prefix user-service
      - run: npm run build --prefix classes-service
      - run: npm run build --prefix registration-service
      - run: npm run build --prefix frontend

  migrations:
    needs: install
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-deps
      # Applies every migration to an empty database, then fails if the
      # Prisma schema (including partial indexes) differs from the result.
      - name: Apply migrations and check for schema drift
        run: |
          for service in user-service classes-service registration-service; do
            export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/${service//-/_}"
            (cd "$service" \
              && npx prisma migrate deploy \
              && npx prisma migrate diff --from-config-datasource \
                --to-schema prisma/schema.prisma --exit-code)
          done

  test:
    needs: install
    runs-on: ubuntu-latest
    env:
      CONTACT_E2E_USE_REAL_REDIS: 'true'
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-deps
      - run: npm test
      - run: npm run test:e2e --prefix backend

  production-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ci-user
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: miya
      RABBITMQ_USER: ci-rabbit
      RABBITMQ_PASS: ci-rabbit-password
      PUBLIC_HOST: ci.example.test
      SESSION_SECRET: ci-session-secret-012345678901234567890123456789
      CORS_ORIGIN: https://ci.example.test
      PUBLIC_APP_URL: https://ci.example.test
      GOOGLE_CLIENT_ID: ci-client-id
      GOOGLE_CLIENT_SECRET: ci-client-secret
      GOOGLE_CALLBACK_URL: https://ci.example.test/api/auth/google/callback
      NEXT_PUBLIC_AUTH_URL: https://ci.example.test/api/auth/google
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-turnstile-site-key
      CONTACT_CHALLENGE_SECRET: ci-contact-challenge-secret
      TURNSTILE_SECRET_KEY: ci-turnstile-secret
      TURNSTILE_HOSTNAME: ci.example.test
      RESEND_API_KEY: re_ci
      CONTACT_EMAIL_TO: ci@example.test
      RESEND_FROM_EMAIL: Move with Miya <ci@example.test>
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      STRIPE_CURRENCY: usd
      TLS_CERT_FILE: /tmp/fullchain.pem
      TLS_KEY_FILE: /tmp/privkey.pem
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate production Compose interpolation
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Validate nginx configuration
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=ci.example.test" \
            -keyout /tmp/privkey.pem -out /tmp/fullchain.pem
          docker run --rm \
            --add-host user-service:127.0.0.1 \
            --add-host frontend:127.0.0.1 \
            --add-host backend:127.0.0.1 \
            -e PUBLIC_HOST=ci.example.test \
            -v "$PWD/nginx/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro" \
            -v /tmp/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro \
            -v /tmp/privkey.pem:/etc/nginx/tls/privkey.pem:ro \
            nginx:alpine nginx -t
      - name: Build production images
        run: |
          docker build -f backend/Dockerfile.prod backend
          docker build -f user-service/Dockerfile.prod user-service
          docker build -f classes-service/Dockerfile.prod classes-service
          docker build -f registration-service/Dockerfile.prod registration-service
          docker build --build-arg NEXT_PUBLIC_AUTH_URL=https://ci.example.test/api/auth/google frontend -f frontend/Dockerfile.prod
