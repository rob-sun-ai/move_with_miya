name: Deploy production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deployment operation
        required: true
        type: choice
        options:
          - deploy
          - rollback
      release_version:
        description: Git SHA to deploy or restore
        required: true
        type: string
      environment:
        description: GitHub environment
        required: true
        type: environment

# The job only talks to the host over SSH; it needs no repository access.
permissions: {}

# One deploy or rollback per environment at a time; later runs queue.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # Validated here, before anything reaches the host: ssh joins its
      # arguments into one string that the remote shell parses.
      - name: Validate inputs
        env:
          OPERATION: ${{ inputs.operation }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          case "$OPERATION" in
            deploy | rollback) ;;
            *) echo 'operation must be deploy or rollback' >&2; exit 1 ;;
          esac
          if ! printf '%s' "$RELEASE_VERSION" | grep -Eqx '[0-9a-f]{40}'; then
            echo 'release_version must be a 40-character lowercase Git SHA' >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ] || {
            echo 'DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS secrets are required' >&2
            exit 1
          }
          install -m 700 -d ~/.ssh
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy or rollback on host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          # Quote each argument for the remote shell.
          remote_args=$(printf '%q ' "$OPERATION" "$RELEASE_VERSION" "$DEPLOY_PATH" "$DEPLOY_ENV_FILE")
          # Only the pinned host key is accepted; never trust on first use.
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
            -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "sh -s -- $remote_args" <<'REMOTE'
          set -eu
          operation=$1
          release_version=$2
          deploy_path=$3
          deploy_env_file=$4

          case "$release_version" in
            *[!A-Fa-f0-9]*|'')
              echo 'release_version must be a Git SHA' >&2
              exit 1
              ;;
          esac
          [ "${#release_version}" -eq 40 ] || {
            echo 'release_version must be a 40-character Git SHA' >&2
            exit 1
          }

          cd "$deploy_path"
          if [ "$operation" = deploy ]; then
            # Never switch the checkout under a running deploy or rollback.
            # Released before deploy.sh, which takes the same lock itself.
            exec 9> "$(git rev-parse --git-path move-with-miya-deploy.lock)"
            flock -n 9 || {
              echo 'Another deploy or rollback is running on this host' >&2
              exit 1
            }
            git fetch --tags origin "$release_version"
            git checkout --detach "$release_version"
            exec 9>&-
            ENV_FILE="$deploy_env_file" RELEASE_VERSION="$release_version" ./ops/deploy.sh
          elif [ "$operation" = rollback ]; then
            ENV_FILE="$deploy_env_file" ROLLBACK_VERSION="$release_version" ./ops/rollback.sh
          else
            echo 'Unsupported deployment operation' >&2
            exit 1
          fi
          REMOTE

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
