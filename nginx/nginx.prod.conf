upstream user_service {
    server user-service:3001;
}

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:3000;
}

# Per-client request limits, ahead of the app's own per-minute checkout
# limits, so a single client flooding the site is turned away here instead of
# reaching Node. $binary_remote_addr is the client only while nginx is the
# edge; behind a CDN or load balancer, set it from real_ip first. The rates
# leave room for an institution whose members share one IP.
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Checkout starts Stripe sessions and holds seats, so it gets a tighter rate.
# Requests mapped to an empty key are not counted. Stripe webhooks arrive from
# Stripe's few IPs in bursts and are verified by signature, so they are left
# to the general limit. $limit_uri is the decoded, normalized path, captured
# before /api/ strips its prefix ($uri is rewritten by the time limits run).
map $limit_uri $checkout_limit_key {
    ~*^/api/checkout/webhook  "";
    ~*^/api/checkout/         $binary_remote_addr;
    default                   "";
}
limit_req_zone $checkout_limit_key zone=checkout_per_ip:10m rate=5r/s;

server {
    listen 80;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Security headers ("always": also on error responses). Locations must
    # not use add_header, or they silently drop all of these.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    set $limit_uri $uri;

    # A page load fetches many assets at once, hence the bursts. Locations
    # inherit these unless they set their own limit_req.
    limit_req zone=per_ip burst=120 nodelay;
    limit_req zone=checkout_per_ip burst=20 nodelay;
    limit_req_status 429;
    limit_conn conn_per_ip 100;
    limit_conn_status 429;

    # Prometheus scrapes services on the internal network only. Express routes
    # case-insensitively, so block /api/Metrics and friends as well.
    location ~* ^/api/metrics(/|$) {
        return 404;
    }

    # User service auth endpoints
    location /api/auth/ {
        proxy_pass http://user_service/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cookie_path /auth/ /api/auth/;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Browsers only ever PATCH a user (profile, role, ban). Every other
    # user-service route (the user list, GET by id, batch lookups, delete) is
    # for internal callers on the Docker network and is not public. Express
    # matches case-insensitively, but other casings fall through to /api/,
    # which has no user routes.
    location /api/users {
        return 404;
    }

    location ~ ^/api/users/[0-9A-Fa-f-]+(/role|/ban)?$ {
        limit_except PATCH {
            deny all;
        }
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Backend API gateway — strips /api prefix before forwarding
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
