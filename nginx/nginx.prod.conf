upstream user_service {
    server user-service:3001;
}

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:3000;
}

# Per-client request limits, ahead of the app's own per-minute checkout
# limits, so a single client flooding the site is turned away here instead of
# reaching Node. $binary_remote_addr is the client only while nginx is the
# edge; behind a CDN or load balancer, set it from real_ip first. The rates
# leave room for an institution whose members share one IP.
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Checkout starts Stripe sessions and holds seats, so it gets a tighter rate.
# Requests mapped to an empty key are not counted. Stripe webhooks arrive from
# Stripe's few IPs in bursts and are verified by signature, so they are left
# to the general limit. $limit_uri is the decoded, normalized path, captured
# before /api/ strips its prefix ($uri is rewritten by the time limits run).
map $limit_uri $checkout_limit_key {
    ~*^/api/checkout/webhook  "";
    ~*^/api/checkout/         $binary_remote_addr;
    default                   "";
}
limit_req_zone $checkout_limit_key zone=checkout_per_ip:10m rate=5r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name ${PUBLIC_HOST};

    # HTTP-01 challenges for certificate renewal (see the production runbook).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 308 https://${PUBLIC_HOST}$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${PUBLIC_HOST};

    ssl_certificate ${TLS_CERT_FILE};
    ssl_certificate_key ${TLS_KEY_FILE};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Security headers ("always": also on error responses). Locations must
    # not use add_header, or they silently drop all of these.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 256k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    set $limit_uri $uri;

    # A page load fetches many assets at once, hence the bursts. Locations
    # inherit these unless they set their own limit_req.
    limit_req zone=per_ip burst=120 nodelay;
    limit_req zone=checkout_per_ip burst=20 nodelay;
    limit_req_status 429;
    limit_conn conn_per_ip 100;
    limit_conn_status 429;

    location = /health/live {
        proxy_pass http://backend/health/live;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /health/ready {
        proxy_pass http://backend/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    # Prometheus scrapes services on the internal network only. Block the
    # backend endpoint through the /api/ prefix-stripping proxy as well,
    # case-insensitively because Express routes ignore case.
    location = /metrics {
        return 404;
    }

    location ~* ^/api/metrics(/|$) {
        return 404;
    }

    # User service auth endpoints
    location /api/auth/ {
        proxy_pass http://user_service/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cookie_path /auth/ /api/auth/;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Browsers only ever PATCH a user (profile, role, ban). Every other
    # user-service route (the user list, GET by id, batch lookups, delete) is
    # for internal callers on the Docker network and is not public. Express
    # matches case-insensitively, but other casings fall through to /api/,
    # which has no user routes.
    location /api/users {
        return 404;
    }

    location ~ ^/api/users/[0-9A-Fa-f-]+(/role|/ban)?$ {
        limit_except PATCH {
            deny all;
        }
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # Backend API gateway — strips /api prefix before forwarding
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Frontend
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}
