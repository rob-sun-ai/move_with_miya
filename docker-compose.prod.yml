# Docker's json-file driver records each container's Compose service name in
# every log line, which Promtail turns into a `service` label.
x-logging: &logging
  driver: json-file
  options:
    labels: com.docker.compose.service

# One-shot Prisma migration job; each service's job reuses its image.
x-migrate: &migrate
  pull_policy: never
  restart: 'no'
  command: ['npx', 'prisma', 'migrate', 'deploy']
  depends_on:
    postgres:
      condition: service_healthy
  logging: *logging

services:
  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *logging

  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *logging

  rabbitmq:
    image: rabbitmq:3.13.7-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  user-service:
    image: move-with-miya/user-service:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: ./user-service
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - '3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/miya_users
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:?GOOGLE_CALLBACK_URL is required}
      OTEL_SERVICE_NAME: user-service
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      RELEASE_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION is required}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      user-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3001/health/ready'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  user-migrate:
    <<: *migrate
    image: move-with-miya/user-service:${RELEASE_VERSION:?RELEASE_VERSION is required}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/miya_users

  backend:
    image: move-with-miya/backend:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      USER_SERVICE_URL: http://user-service:3001
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:?CONTACT_EMAIL_TO is required}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?RESEND_FROM_EMAIL is required}
      CONTACT_CHALLENGE_SECRET: ${CONTACT_CHALLENGE_SECRET:?CONTACT_CHALLENGE_SECRET is required}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      TURNSTILE_ACTION: ${TURNSTILE_ACTION:-contact}
      TURNSTILE_HOSTNAME: ${TURNSTILE_HOSTNAME:?TURNSTILE_HOSTNAME is required}
      CONTACT_IP_ATTEMPT_LIMIT: ${CONTACT_IP_ATTEMPT_LIMIT:-100}
      CONTACT_IP_ATTEMPT_TTL_MS: ${CONTACT_IP_ATTEMPT_TTL_MS:-600000}
      CONTACT_COOKIE_SUBMISSION_LIMIT: ${CONTACT_COOKIE_SUBMISSION_LIMIT:-3}
      CONTACT_COOKIE_SUBMISSION_TTL_MS: ${CONTACT_COOKIE_SUBMISSION_TTL_MS:-3600000}
      CHECKOUT_IP_ATTEMPT_LIMIT: ${CHECKOUT_IP_ATTEMPT_LIMIT:-60}
      CHECKOUT_IP_ATTEMPT_TTL_MS: ${CHECKOUT_IP_ATTEMPT_TTL_MS:-60000}
      CHECKOUT_USER_ATTEMPT_LIMIT: ${CHECKOUT_USER_ATTEMPT_LIMIT:-5}
      CHECKOUT_USER_ATTEMPT_TTL_MS: ${CHECKOUT_USER_ATTEMPT_TTL_MS:-60000}
      CHECKOUT_REFUND_ATTEMPT_LIMIT: ${CHECKOUT_REFUND_ATTEMPT_LIMIT:-30}
      CHECKOUT_REFUND_ATTEMPT_TTL_MS: ${CHECKOUT_REFUND_ATTEMPT_TTL_MS:-60000}
      CHECKOUT_REFUND_USER_ATTEMPT_LIMIT: ${CHECKOUT_REFUND_USER_ATTEMPT_LIMIT:-10}
      CHECKOUT_REFUND_USER_ATTEMPT_TTL_MS: ${CHECKOUT_REFUND_USER_ATTEMPT_TTL_MS:-60000}
      CHECKOUT_STATUS_ATTEMPT_LIMIT: ${CHECKOUT_STATUS_ATTEMPT_LIMIT:-300}
      CHECKOUT_STATUS_ATTEMPT_TTL_MS: ${CHECKOUT_STATUS_ATTEMPT_TTL_MS:-60000}
      CHECKOUT_STATUS_USER_ATTEMPT_LIMIT: ${CHECKOUT_STATUS_USER_ATTEMPT_LIMIT:-30}
      CHECKOUT_STATUS_USER_ATTEMPT_TTL_MS: ${CHECKOUT_STATUS_USER_ATTEMPT_TTL_MS:-60000}
      USER_HEALTH_URL: http://user-service:3001/health/ready
      CLASSES_HEALTH_URL: http://classes-service:3004/health/ready
      REGISTRATION_HEALTH_URL: http://registration-service:3005/health/ready
      GRAFANA_PUBLIC_URL: ${GRAFANA_PUBLIC_URL:-}
      OTEL_SERVICE_NAME: backend
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      RELEASE_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION is required}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/health/ready'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  classes-service:
    image: move-with-miya/classes-service:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: ./classes-service
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - '3004'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/miya_classes
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      HEALTH_PORT: 3004
      OTEL_SERVICE_NAME: classes-service
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      RELEASE_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION is required}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      classes-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3004/health/ready'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  classes-migrate:
    <<: *migrate
    image: move-with-miya/classes-service:${RELEASE_VERSION:?RELEASE_VERSION is required}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/miya_classes

  registration-service:
    image: move-with-miya/registration-service:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: ./registration-service
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - '3005'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/miya_registrations
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      HEALTH_PORT: 3005
      OTEL_SERVICE_NAME: registration-service
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      RELEASE_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION is required}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      registration-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3005/health/ready'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  registration-migrate:
    <<: *migrate
    image: move-with-miya/registration-service:${RELEASE_VERSION:?RELEASE_VERSION is required}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/miya_registrations

  frontend:
    image: move-with-miya/frontend:${RELEASE_VERSION:?RELEASE_VERSION is required}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:?NEXT_PUBLIC_AUTH_URL is required}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?NEXT_PUBLIC_TURNSTILE_SITE_KEY is required}
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      USER_SERVICE_URL: http://user-service:3001
      BACKEND_URL: http://backend:3000
      RELEASE_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION is required}
    depends_on:
      backend:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  nginx:
    image: nginx:1.31.7-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro,z
      # The whole certificate tree, mounted at the same path, so Let's Encrypt's
      # live/ symlinks keep resolving to the current archive/ files after a
      # renewal. TLS_CERT_FILE and TLS_KEY_FILE must be inside TLS_CERT_DIR.
      - ${TLS_CERT_DIR:-/etc/letsencrypt}:${TLS_CERT_DIR:-/etc/letsencrypt}:ro,z
      - ${ACME_WEBROOT:-/var/www/acme}:/var/www/acme:ro,z
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
      TLS_CERT_FILE: ${TLS_CERT_FILE:?TLS_CERT_FILE is required}
      TLS_KEY_FILE: ${TLS_KEY_FILE:?TLS_KEY_FILE is required}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      user-service:
        condition: service_healthy
    logging: *logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    restart: unless-stopped
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./ops/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro,z
    depends_on:
      - tempo
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-14d}'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}'
    volumes:
      - prometheus-data:/prometheus
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
    logging: *logging

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    command: ['-config.file=/etc/loki/config.yaml']
    volumes:
      - loki-data:/loki
      - ./ops/observability/loki.yaml:/etc/loki/config.yaml:ro,z
    logging: *logging

  promtail:
    image: grafana/promtail:3.5.0
    restart: unless-stopped
    command: ['-config.file=/etc/promtail/config.yaml']
    volumes:
      - ./ops/observability/promtail.yaml:/etc/promtail/config.yaml:ro,z
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-data:/tmp
    depends_on:
      - loki
    logging: *logging

  tempo:
    image: grafana/tempo:2.7.2
    restart: unless-stopped
    command: ['-config.file=/etc/tempo/config.yaml']
    volumes:
      - tempo-data:/var/tempo
      - ./ops/observability/tempo.yaml:/etc/tempo/config.yaml:ro,z
    logging: *logging

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro,z
    depends_on:
      - prometheus
      - loki
      - tempo
    logging: *logging

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  promtail-data:
