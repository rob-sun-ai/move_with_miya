services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/miya_users
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      SESSION_SECRET: ${SESSION_SECRET}
      USER_SERVICE_URL: http://user-service:3001
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      RESEND_API_KEY: ${RESEND_API_KEY}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Move with Miya <onboarding@resend.dev>}
      CONTACT_CHALLENGE_SECRET: ${CONTACT_CHALLENGE_SECRET}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      TURNSTILE_ACTION: ${TURNSTILE_ACTION:-contact}
      TURNSTILE_HOSTNAME: ${TURNSTILE_HOSTNAME:?TURNSTILE_HOSTNAME is required}
      CONTACT_IP_ATTEMPT_LIMIT: ${CONTACT_IP_ATTEMPT_LIMIT:-100}
      CONTACT_IP_ATTEMPT_TTL_MS: ${CONTACT_IP_ATTEMPT_TTL_MS:-600000}
      CONTACT_COOKIE_SUBMISSION_LIMIT: ${CONTACT_COOKIE_SUBMISSION_LIMIT:-3}
      CONTACT_COOKIE_SUBMISSION_TTL_MS: ${CONTACT_COOKIE_SUBMISSION_TTL_MS:-3600000}
      CHECKOUT_IP_ATTEMPT_LIMIT: ${CHECKOUT_IP_ATTEMPT_LIMIT:-30}
      CHECKOUT_IP_ATTEMPT_TTL_MS: ${CHECKOUT_IP_ATTEMPT_TTL_MS:-600000}
      CHECKOUT_USER_ATTEMPT_LIMIT: ${CHECKOUT_USER_ATTEMPT_LIMIT:-20}
      CHECKOUT_USER_ATTEMPT_TTL_MS: ${CHECKOUT_USER_ATTEMPT_TTL_MS:-600000}
      CHECKOUT_REFUND_ATTEMPT_LIMIT: ${CHECKOUT_REFUND_ATTEMPT_LIMIT:-30}
      CHECKOUT_REFUND_ATTEMPT_TTL_MS: ${CHECKOUT_REFUND_ATTEMPT_TTL_MS:-600000}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  classes-service:
    build:
      context: ./classes-service
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/miya_classes
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  registration-service:
    build:
      context: ./registration-service
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/miya_registrations
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-https://example.com/api/auth/google}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      USER_SERVICE_URL: http://user-service:3001
      BACKEND_URL: http://backend:3000

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro,z
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
      - user-service

volumes:
  redis-data:
  postgres-data:
