services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    image: move-with-miya/user-service:${RELEASE_VERSION:-development}
    build:
      context: ./user-service
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - '3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/miya_users
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:?GOOGLE_CALLBACK_URL is required}
      RELEASE_VERSION: ${RELEASE_VERSION:-development}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      user-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3001/health/ready'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  user-migrate:
    image: move-with-miya/user-service:${RELEASE_VERSION:-development}
    pull_policy: never
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/miya_users
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: move-with-miya/backend:${RELEASE_VERSION:-development}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      USER_SERVICE_URL: http://user-service:3001
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:?CONTACT_EMAIL_TO is required}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:?RESEND_FROM_EMAIL is required}
      CONTACT_CHALLENGE_SECRET: ${CONTACT_CHALLENGE_SECRET:?CONTACT_CHALLENGE_SECRET is required}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      TURNSTILE_ACTION: ${TURNSTILE_ACTION:-contact}
      TURNSTILE_HOSTNAME: ${TURNSTILE_HOSTNAME:?TURNSTILE_HOSTNAME is required}
      CONTACT_IP_ATTEMPT_LIMIT: ${CONTACT_IP_ATTEMPT_LIMIT:-100}
      CONTACT_IP_ATTEMPT_TTL_MS: ${CONTACT_IP_ATTEMPT_TTL_MS:-600000}
      CONTACT_COOKIE_SUBMISSION_LIMIT: ${CONTACT_COOKIE_SUBMISSION_LIMIT:-3}
      CONTACT_COOKIE_SUBMISSION_TTL_MS: ${CONTACT_COOKIE_SUBMISSION_TTL_MS:-3600000}
      CHECKOUT_IP_ATTEMPT_LIMIT: ${CHECKOUT_IP_ATTEMPT_LIMIT:-60}
      CHECKOUT_IP_ATTEMPT_TTL_MS: ${CHECKOUT_IP_ATTEMPT_TTL_MS:-60000}
      CHECKOUT_USER_ATTEMPT_LIMIT: ${CHECKOUT_USER_ATTEMPT_LIMIT:-5}
      CHECKOUT_USER_ATTEMPT_TTL_MS: ${CHECKOUT_USER_ATTEMPT_TTL_MS:-60000}
      CHECKOUT_REFUND_ATTEMPT_LIMIT: ${CHECKOUT_REFUND_ATTEMPT_LIMIT:-30}
      CHECKOUT_REFUND_ATTEMPT_TTL_MS: ${CHECKOUT_REFUND_ATTEMPT_TTL_MS:-60000}
      CHECKOUT_REFUND_USER_ATTEMPT_LIMIT: ${CHECKOUT_REFUND_USER_ATTEMPT_LIMIT:-10}
      CHECKOUT_REFUND_USER_ATTEMPT_TTL_MS: ${CHECKOUT_REFUND_USER_ATTEMPT_TTL_MS:-60000}
      CHECKOUT_STATUS_ATTEMPT_LIMIT: ${CHECKOUT_STATUS_ATTEMPT_LIMIT:-300}
      CHECKOUT_STATUS_ATTEMPT_TTL_MS: ${CHECKOUT_STATUS_ATTEMPT_TTL_MS:-60000}
      CHECKOUT_STATUS_USER_ATTEMPT_LIMIT: ${CHECKOUT_STATUS_USER_ATTEMPT_LIMIT:-30}
      CHECKOUT_STATUS_USER_ATTEMPT_TTL_MS: ${CHECKOUT_STATUS_USER_ATTEMPT_TTL_MS:-60000}
      USER_HEALTH_URL: http://user-service:3001/health/ready
      CLASSES_HEALTH_URL: http://classes-service:3004/health/ready
      REGISTRATION_HEALTH_URL: http://registration-service:3005/health/ready
      RELEASE_VERSION: ${RELEASE_VERSION:-development}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/health/ready'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  classes-service:
    image: move-with-miya/classes-service:${RELEASE_VERSION:-development}
    build:
      context: ./classes-service
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - '3004'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/miya_classes
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      HEALTH_PORT: 3004
      RELEASE_VERSION: ${RELEASE_VERSION:-development}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      classes-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3004/health/ready'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  classes-migrate:
    image: move-with-miya/classes-service:${RELEASE_VERSION:-development}
    pull_policy: never
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/miya_classes
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy

  registration-service:
    image: move-with-miya/registration-service:${RELEASE_VERSION:-development}
    build:
      context: ./registration-service
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    expose:
      - '3005'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/miya_registrations
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      HEALTH_PORT: 3005
      RELEASE_VERSION: ${RELEASE_VERSION:-development}
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      registration-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3005/health/ready'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  registration-migrate:
    image: move-with-miya/registration-service:${RELEASE_VERSION:-development}
    pull_policy: never
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/miya_registrations
    command: ['npx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: move-with-miya/frontend:${RELEASE_VERSION:-development}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:?NEXT_PUBLIC_AUTH_URL is required}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?NEXT_PUBLIC_TURNSTILE_SITE_KEY is required}
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      USER_SERVICE_URL: http://user-service:3001
      BACKEND_URL: http://backend:3000
      RELEASE_VERSION: ${RELEASE_VERSION:-development}
    depends_on:
      backend:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro,z
      - ${TLS_CERT_FILE:?TLS_CERT_FILE is required}:/etc/nginx/tls/fullchain.pem:ro,z
      - ${TLS_KEY_FILE:?TLS_KEY_FILE is required}:/etc/nginx/tls/privkey.pem:ro,z
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      user-service:
        condition: service_healthy

volumes:
  redis-data:
  postgres-data:
